[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrpbook"
version = "1.0.0"
description = "Companion code for 'Delivery Route Optimization with Python'"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohammed Islam Hadjoudj" }]
dependencies = [
    "ortools>=9.10,<10",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "networkx>=3.0",
    "pyvrp>=0.14,<0.15",          # 0.14 is the version the book's results used
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]
service = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]   # Chapter 15
geocoding = ["geopy>=2.4"]   # optional online geocoder (Nominatim)
roads = ["pyproj>=3.6", "osmnx>=2.0"]   # Chapter 4: CATS network projection, OpenStreetMap

[tool.setuptools]
packages = ["vrpbook", "routing_service", "case_study"]

[tool.pytest.ini_options]
testpaths = ["tests"]
